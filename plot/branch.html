<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潜伏之赤途 · 剧情分支图</title>
<link rel="stylesheet" href="/plot/css/style.css">
</head>
<body class="branch">
<header class="topbar">
  <h1>潜伏之赤途 <small>剧情分支图</small></h1>
  <nav id="chapter-quick" title="快捷定位章节"></nav>
  <select id="jump-toc" title="定位章节"></select>
  <span class="spacer"></span>
  <a class="btn" href="/plot">剧情速览</a>
</header>
<div class="branch-wrap">
  <div class="graph-area">
    <div class="graph-scroll" id="graph-scroll"></div>
    <div id="graph-minimap" title="微缩图 · 点击可定位"></div>
  </div>
  <aside class="side-panel" id="panel">
    <div class="panel-empty">点击图中任意章节节点<br>查看详情与跳转关系<br><br>滚轮缩放 · 拖拽平移</div>
  </aside>
</div>
<div class="graph-tools">
  <button class="btn" id="zreset" title="重置视图">⟲ 重置</button>
</div>

<!-- Vercel Analytics + G6 分支图渲染 -->
<script type="module" src="/src/branch-main.js"></script>
</body>
</html>
